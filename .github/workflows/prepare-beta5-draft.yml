name: Prepare signed V6.2 Beta.5 draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-beta5-draft.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naiwa-beta5-draft
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'justinleo624/naiwa-v62-updates' && github.ref == 'refs/heads/main' && github.actor == 'justinleo624'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: justinleo624/naiwa-v62-updates
    steps:
      - name: Require that published update index remains Beta.4
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/beta/latest.json" --jq .content | base64 -d > "$RUNNER_TEMP/latest.json"
          node - <<'NODE'
          const fs=require('fs');
          const index=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/latest.json','utf8'));
          if(index.version!=='0.6.2-beta.4')throw Error('Current index is not Beta.4; abort Beta.5 draft preparation');
          const p=Object.keys(index.platforms||{}).sort();
          if(JSON.stringify(p)!==JSON.stringify(['darwin-aarch64','windows-x86_64']))throw Error('Unexpected existing platforms');
          console.log('PASS: Beta.4 signed updater remains untouched');
          NODE
      - name: Create the next unsigned draft placeholder (no binaries)
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.6.2-beta.5
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            current="$(gh api "repos/$REPO/releases/tags/$tag")"
            test "$(jq -r '.draft' <<<"$current")" = true || { echo 'Refusing to modify a published Beta.5'; exit 1; }
            echo 'Existing Beta.5 draft remains intact'
          else
            gh release create "$tag" --repo "$REPO" --target main --draft --prerelease \
              --title "奶蛙邮局 V6.2 Beta.5 — 邮箱与短信认证" \
              --notes "待验证 Resend 邮箱、阿里云 PNVS 短信服务和两台机器的同密钥 Tauri 签名安装包。此为非公开草稿，暂不对朋友提供下载。"
            echo 'Beta.5 draft created, without assets or manifest change'
          fi
