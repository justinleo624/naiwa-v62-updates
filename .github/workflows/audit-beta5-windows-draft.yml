name: Audit uploaded Beta.5 Windows draft (read-only)
# Draft release byte checks only. Does not publish, re-sign or alter update index.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-beta5-windows-draft.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the existing uploaded draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beta5-audit"
          gh release download v0.6.2-beta.5 \
            --repo justinleo624/naiwa-v62-updates \
            --dir "$RUNNER_TEMP/beta5-audit" \
            --pattern "naiwa-windows-x86_64.exe" \
            --pattern "naiwa-windows-x86_64.exe.sig" \
            --pattern "BUILD_RESULT_WINDOWS.md" \
            --pattern "SHA256SUMS_WINDOWS.txt"
          test -s "$RUNNER_TEMP/beta5-audit/naiwa-windows-x86_64.exe"
          test -s "$RUNNER_TEMP/beta5-audit/naiwa-windows-x86_64.exe.sig"
          test -s "$RUNNER_TEMP/beta5-audit/BUILD_RESULT_WINDOWS.md"
          test -s "$RUNNER_TEMP/beta5-audit/SHA256SUMS_WINDOWS.txt"
          echo "Downloaded four Beta.5 draft assets through GitHub API"
      - name: Independently verify exact uploaded Windows binary and signature bytes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/beta5-audit"
          printf '%s  %s\n' \
            '56a4b5a6e06783851210fc9519b4093be4d9c9fb7954ce0f4ab9501b4388161a' \
            'naiwa-windows-x86_64.exe' | sha256sum --check --strict
          printf '%s  %s\n' \
            '68074842c8abc64abd732a890446ee8f9a2062ffc404534bbb06f1f814cc9c25' \
            'naiwa-windows-x86_64.exe.sig' | sha256sum --check --strict
          test "$(wc -c < naiwa-windows-x86_64.exe)" -eq 4757006
          echo "PASS: exact uploaded Windows Beta.5 EXE and .sig match the Owner-reported byte hashes"
          echo "NOTE: SHA-256 verification is not an additional cryptographic signature verification."
      - name: Extract ONLY non-sensitive regression failure names from report
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const p=path.join(process.env.RUNNER_TEMP,'beta5-audit','BUILD_RESULT_WINDOWS.md');
          const lines=fs.readFileSync(p,'utf8').split(/\r?\n/);
          console.log('Report bytes: '+fs.statSync(p).size);
          const hits=[];
          for(const line of lines){
            const trimmed=line.trim();
            if(!trimmed || /@|(?:[0-9]{11})|AccessKey|secret|pepper|token|password|C:\\\\|[A-Za-z]:\\\\/i.test(trimmed))continue;
            if(/not ok|FAIL|failed|失败|断言|回归|UI|old|旧版|旧 UI|129|131/i.test(trimmed)){
              const clean=trimmed.replace(/[A-Za-z]:[\\/][^\s)]+/g,'[LOCAL_PATH]').replace(/https?:\/\/\S+/g,'[URL]');
              hits.push(clean.slice(0,240));
            }
          }
          for(const x of hits.slice(0,28))console.log('REPORT_SUMMARY: '+x);
          if(!hits.length)console.log('No diagnostic heading found; request the relevant sanitized failure assertion section from Owner');
          NODE
