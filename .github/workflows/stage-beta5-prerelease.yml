name: Stage verified Beta.5 prerelease (NO updater rollout)
# Publicly exposes already-signed beta installers for opt-in real-client QA.
# DO NOT modify beta/latest.json, site binaries, or Render/Railway here.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage-beta5-prerelease.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naiwa-beta5-release-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'justinleo624/naiwa-v62-updates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: justinleo624/naiwa-v62-updates
      RELEASE_ID: "422781043"
      TAG: v0.6.2-beta.5
    steps:
      - name: Recheck immutable assets and Beta.4 live update index
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          gh api "repos/$REPO/contents/beta/latest.json" --jq .content | base64 -d > "$RUNNER_TEMP/latest-before.json"
          node <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/release.json'));
          const m=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/latest-before.json'));
          assert.equal(r.tag_name,'v0.6.2-beta.5');
          assert.equal(r.prerelease,true);
          assert.equal(m.version,'0.6.2-beta.4');
          assert.deepEqual(Object.keys(m.platforms).sort(),['darwin-aarch64','windows-x86_64']);
          const x={
            'naiwa-windows-x86_64.exe':'56a4b5a6e06783851210fc9519b4093be4d9c9fb7954ce0f4ab9501b4388161a',
            'naiwa-windows-x86_64.exe.sig':'68074842c8abc64abd732a890446ee8f9a2062ffc404534bbb06f1f814cc9c25',
            'naiwa-darwin-aarch64.dmg':'213196b4ca0e26ee7fd271f7537b1aa7872ef0422916b6d761298b10effa8256',
            'naiwa-darwin-aarch64.app.tar.gz':'bc214caceb2dd3bde3b2ba66e071b01d8c33fe131881153b3bedc2b8b137ba6e',
            'naiwa-darwin-aarch64.app.tar.gz.sig':'af28fc182c37f4728fcf598f9ecc170e3d32d59116433abf051c45305a5af184',
            'BUILD_RESULT_WINDOWS.md':'327ab17b83ba303335bfc45ad039f3c03e123f1ceff686c0d35e80c57be60c72',
            'SHA256SUMS_WINDOWS.txt':'a2bb9c16edaf4e174e8715c87486a207b811f84d9c952fe2b14247c1fa5736f0'
          };
          assert.equal(r.assets.length,Object.keys(x).length);
          for(const [name,sha] of Object.entries(x)){
            const a=r.assets.find(v=>v.name===name);
            assert.ok(a&&a.state==='uploaded'&&a.digest==='sha256:'+sha,'mismatch '+name);
          }
          console.log('PASS: 7 immutable draft asset SHA-256 values and previous Beta.4 update index');
          NODE
      - name: Publish only versioned Beta.5 prerelease for manual install testing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          奶蛙邮局 V6.2 Beta.5 — 邮箱 / 手机验证码登录切换界面。

          此版本是供内测成员**手动下载安装和验收**的预发布版。现有 Beta.4 用户暂时不会收到自动升级；自动更新清单仍指向 Beta.4，待 Beta.5 实机验收后再单独启用。

          - Windows 10/11 x64：下载 naiwa-windows-x86_64.exe
          - macOS Apple Silicon：下载 naiwa-darwin-aarch64.dmg
          - 固定 Render Beta API：https://naiwa-v62-beta3-api.onrender.com
          - 原始签名构建源码：dfe290c4eeca8ec2d67d85ceb26b3fde78d77bf7
          - Mac/Windows Tauri 更新密钥与 Beta.4 保持一致。
          - 邮箱、短信注册登录的后端流程已在旧客户端 Beta.4 完成真实设备验证；Beta.5 新界面仍需测试。
          - 安装风险：Mac 安装包为 Apple ad-hoc 签名，未经 Apple 公证；Tauri 更新签名并不等同于操作系统开发者身份签名。

          发行源代码（私有仓库）：justinleo624/naiwa-desktop-v6。
          NOTES
          if [ "$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq .draft)" = true ]; then
            body="$(cat "$RUNNER_TEMP/release-notes.md")"
            gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=true -f body="$body" >/dev/null
          fi
          test "$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq .draft)" = false
          echo 'PASS: Beta.5 published as a prerelease; no update manifest was modified'
      - name: Verify the versioned installer files are publicly downloadable
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$TAG"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 90 \
            "$base/naiwa-windows-x86_64.exe" -o "$RUNNER_TEMP/test-windows.exe"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 90 \
            "$base/naiwa-darwin-aarch64.dmg" -o "$RUNNER_TEMP/test-macos.dmg"
          printf '%s  %s\n' '56a4b5a6e06783851210fc9519b4093be4d9c9fb7954ce0f4ab9501b4388161a' "$RUNNER_TEMP/test-windows.exe" | sha256sum --check --strict
          printf '%s  %s\n' '213196b4ca0e26ee7fd271f7537b1aa7872ef0422916b6d761298b10effa8256' "$RUNNER_TEMP/test-macos.dmg" | sha256sum --check --strict
          echo 'PASS: BOTH public GitHub installer downloads match original frozen SHA-256 values.'
      - name: Confirm automatic updater remains Beta.4 (no unexpected rollout)
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/beta/latest.json" --jq .content | base64 -d > "$RUNNER_TEMP/latest-after.json"
          cmp "$RUNNER_TEMP/latest-before.json" "$RUNNER_TEMP/latest-after.json"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/latest-after.json'));if(m.version!=='0.6.2-beta.4')throw Error('Unsafe auto-update changed');console.log('PASS: Beta.4 remains the active updater index.')"
